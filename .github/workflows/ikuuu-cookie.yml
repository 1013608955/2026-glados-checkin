name: ikuuu Cookie Health Check

# 这个工作流**不尝试登录** —— ikuuu 的 Geetest v4 无法在 GitHub-hosted runner 上
# 无人值守完成，硬跑只会白白超时失败。
#
# 职责：每天巡检一次 Secret 里的 IKUUU_COOKIE，快过期就发警告，失效就让工作流失败
# （GitHub 会给仓库管理员发邮件），提醒你在本机跑一次 refresh。
#
# 刷新 Cookie 的正确姿势（本机，约 10 秒）：
#   python ikuuu_login.py refresh --push-secret

on:
  schedule:
    # 每天 UTC 23:00（北京时间 07:00）巡检一次
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikuuu-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
      IKUUU_BASE_URL: ${{ secrets.IKUUU_BASE_URL || 'https://ikuuu.win' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # 只用 requests，不装 Playwright —— 巡检必须又快又稳
        run: pip install requests

      - name: Check Cookie Expiry
        id: check
        run: |
          python - <<'PY'
          import json, os, sys, time
          import requests

          cookie = os.environ.get("IKUUU_COOKIE", "").strip()
          base = os.environ.get("IKUUU_BASE_URL", "https://ikuuu.win").rstrip("/")
          if not cookie:
              print("::error::Secret IKUUU_COOKIE 未设置")
              sys.exit(1)

          # expire_in 是 ikuuu 写在 cookie 里的过期时间戳（固定 7 天，不滑动续期）
          expire_ts = None
          for part in cookie.split(";"):
              kv = part.strip().split("=", 1)
              if len(kv) == 2 and kv[0].strip() == "expire_in":
                  try:
                      expire_ts = int(kv[1])
                  except ValueError:
                      pass
          left = (expire_ts - time.time()) / 86400.0 if expire_ts else None

          r = requests.get(
              f"{base}/user",
              headers={
                  "Cookie": cookie,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36",
              },
              timeout=25, allow_redirects=False)
          alive = r.status_code == 200

          print(f"Cookie 有效性: {'有效' if alive else '失效'} (HTTP {r.status_code})")
          if left is not None:
              print(f"剩余天数: {left:.2f}")

          if not alive:
              print("::error::ikuuu Cookie 已失效，请在本机执行: "
                    "python ikuuu_login.py refresh --push-secret")
              sys.exit(1)

          if left is not None and left <= 1.5:
              print("::warning::ikuuu Cookie 剩余不足 1.5 天，"
                    "请尽快在本机执行: python ikuuu_login.py refresh --push-secret")
          elif left is not None and left <= 3:
              print(f"::notice::ikuuu Cookie 剩余 {left:.2f} 天")
          PY
