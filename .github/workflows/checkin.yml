name: 多平台自动签到（GLaDOS + ikuuu + SMAI + 42w）

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30) - 上午签到
    - cron: '30 1 * * *'
    # 北京时间 19:30 (UTC 11:30) - 下午签到
    - cron: '30 11 * * *'
  workflow_dispatch:

# 最小权限：本工作流只用 GITHUB_TOKEN 做 checkout + 上传日志 artifact；
# SMAI token 回写走用户自备的 REPO_PAT（建议细粒度令牌，仅本仓 Secrets: write）。
permissions:
  contents: read
  actions: write

# 防止重叠运行（定时/手动同时触发时排队，不互相打断导致重复签到）
concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # ★ 必须**大于**各步骤超时之和（3+4+3=10）再留余量：
    #   只要 job 先于步骤超时，就不会出现「job 被 cancelled」——
    #   而 cancelled 的 job GitHub 不保留日志，等于黑盒（2026-10-05 就吃了这个亏）。
    #   让步骤超时先触发，失败会带日志，可查。
    timeout-minutes: 12
    # 所有步骤共用同一套 Secret 环境，避免「Run / Retry」两步各写一遍导致漏配
    env:
      GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      WPUSH_APIKEY: ${{ secrets.WPUSH_APIKEY }}
      IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
      SMAI_SESSION: ${{ secrets.SMAI_SESSION }}
      SMAI_USER_ID: ${{ secrets.SMAI_USER_ID }}
      SMAI_REFRESH: ${{ secrets.SMAI_REFRESH }}
      W42_COOKIE: ${{ secrets.W42_COOKIE }}
      W42_UID: ${{ secrets.W42_UID }}
      W42_PROXY: ${{ secrets.W42_PROXY }}
      W42_SUB: ${{ secrets.W42_SUB }}
      W42_SUB_NODE: ${{ secrets.W42_SUB_NODE }}
      # 兜底通道：本机同步上来的单节点配置（w42_sync_node.py 写入）。
      # 机场订阅常对机房 IP 返回 403 或空节点列表，此时 gen_mihomo_config.py
      # 直接用这份配置，不再下载订阅。有值时优先于 W42_SUB。
      W42_NODE_YAML: ${{ secrets.W42_NODE_YAML }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
      # mihomo 版本提到 job 级：缓存 key 与下载步骤共用同一个值，避免两处漂移。
      # 官方 release 不发布校验和文件，SHA256 用预先算好的值钉死（防供应链投毒）；
      # **升级 MIHOMO_VER 时必须同步更新 MIHOMO_SHA256**。
      MIHOMO_VER: v1.19.30
      MIHOMO_SHA256: cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复签到状态缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .checkin_state.json
          key: checkin-state-${{ github.run_id }}
          restore-keys: |
            checkin-state-

      - name: 恢复 ikuuu Cookie 缓存
        # ikuuu-cookie.yml 每 3 天用无头浏览器刷新一次 Cookie 并写回这里。
        # checkin.py 优先使用该文件（而非可能已过期的 IKUUU_COOKIE Secret）。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ikuuu_cookie.json
          key: ikuuu-cookie-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ikuuu-cookie-v1-

      - name: 缓存 mihomo 二进制
        # 命中缓存即可完全跳过下载，从根上消除「下载卡住把 job 拖到超时」。
        # key 只跟版本号走：升级 MIHOMO_VER 会自动换 key，不会用到旧二进制。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mihomo
          key: mihomo-${{ runner.os }}-${{ env.MIHOMO_VER }}-${{ env.MIHOMO_SHA256 }}

      - name: 安装 mihomo（仅 42w 订阅代理需要）
        # mihomo 只服务于 42w 的一条隧道，绝不该拖累 GLaDOS / ikuuu 签到。
        # 四重防护：
        #   ① 未配 W42_SUB / W42_NODE_YAML 直接跳过，省掉每次几十 MB 下载
        #   ② 优先命中上面的缓存
        #   ③ continue-on-error —— 装失败也继续跑签到（42w 降级为直连）
        #   ④ 版本钉死 + SHA256 校验，不再依赖 api.github.com
        #
        # ★ 2026-10-05 事故：run 37364913915 的 job 实跑满 15 分钟后被 cancelled，
        #   而 GitHub **不给 cancelled 的 job 保留日志**，完全无法定位。
        #   当时这行是 `--retry 3 --max-time 300`，最坏 3×300+2×5 = 910 秒，
        #   与观测到的 901 秒高度吻合 —— 下载一卡就把整个 job 吃光。
        #   现在：收紧到 --retry 2 --max-time 60（最坏 ~2 分钟）+ 步骤级 timeout，
        #   并加缓存让绝大多数运行根本不下载。
        # ★ 关键原则：与其让 job 整体被取消（日志全丢），不如让**步骤**超时失败
        #   —— 失败会留下可读日志，取消不会。
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -z "${W42_SUB:-}" ] && [ -z "${W42_NODE_YAML:-}" ]; then
            echo "未配置 W42_SUB / W42_NODE_YAML，跳过 mihomo 安装"
            exit 0
          fi
          if [ -x ./mihomo ]; then
            echo "mihomo 已存在（缓存命中或上一步装好），跳过下载"
            ./mihomo -v || true
            exit 0
          fi
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-amd64-${MIHOMO_VER}.gz"
          echo "下载 mihomo ${MIHOMO_VER}"
          curl -fsSL --retry 2 --retry-delay 5 --max-time 60 "$URL" -o mihomo.gz
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          echo "✅ SHA256 校验通过"
          gunzip -f mihomo.gz && chmod +x mihomo
          ./mihomo -v || true

      - name: 执行多平台签到
        id: checkin
        # 正常耗时 < 1 分钟（实测 14~53 秒）。8 分钟窗口太大：一旦某个请求卡住，
        # 会白等到 job 级超时被 cancelled，而 cancelled 的 job 不留日志。
        # 收紧到 4 分钟 —— 宁可让这一步「失败」（有日志可查），也不要整体被取消。
        run: bash run_checkin.sh
        timeout-minutes: 4

      - name: 检查下午免签
        id: skip_check
        run: |
          if grep -q "SKIP_AFTERNOON=true" checkin_output.txt; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "🎉 上午全部成功，下午已跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 失败自动重试
        if: failure()
        # 含 60 秒 sleep，3 分钟足够（正常重试 < 1 分钟）
        timeout-minutes: 3
        run: |
          echo "首次失败，60秒后重试..."
          sleep 60
          bash run_checkin.sh

      - name: 上传调试日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkin-debug-${{ github.run_id }}
          path: |
            checkin_output.txt
            mihomo.log
          if-no-files-found: ignore
          retention-days: 7
