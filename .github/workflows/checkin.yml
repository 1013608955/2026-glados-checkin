name: Multi-Platform Checkin (GLaDOS + ikuuu + SMAI + 42w)

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30) - 上午签到
    - cron: '30 1 * * *'
    # 北京时间 19:30 (UTC 11:30) - 下午签到
    - cron: '30 11 * * *'
  workflow_dispatch:

# 最小权限：本工作流只用 GITHUB_TOKEN 做 checkout + 上传日志 artifact；
# SMAI token 回写走用户自备的 REPO_PAT（建议细粒度令牌，仅本仓 Secrets: write）。
permissions:
  contents: read
  actions: write

# 防止重叠运行（定时/手动同时触发时排队，不互相打断导致重复签到）
concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 所有步骤共用同一套 Secret 环境，避免「Run / Retry」两步各写一遍导致漏配
    env:
      GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      WPUSH_APIKEY: ${{ secrets.WPUSH_APIKEY }}
      IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
      SMAI_SESSION: ${{ secrets.SMAI_SESSION }}
      SMAI_USER_ID: ${{ secrets.SMAI_USER_ID }}
      SMAI_REFRESH: ${{ secrets.SMAI_REFRESH }}
      W42_COOKIE: ${{ secrets.W42_COOKIE }}
      W42_UID: ${{ secrets.W42_UID }}
      W42_PROXY: ${{ secrets.W42_PROXY }}
      W42_SUB: ${{ secrets.W42_SUB }}
      W42_SUB_NODE: ${{ secrets.W42_SUB_NODE }}
      REPO_PAT: ${{ secrets.REPO_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore Checkin State
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .checkin_state.json
          key: checkin-state-${{ github.run_id }}
          restore-keys: |
            checkin-state-

      - name: Restore ikuuu Cookie Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ikuuu_cookie.json
          key: ikuuu-cookie-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ikuuu-cookie-v1-

      - name: Install mihomo (Clash Meta, 供 W42_SUB 订阅代理)
        run: |
          if [ -x ./mihomo ]; then
            echo "mihomo 已存在，跳过下载"
          else
            VER=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name": "\K[^"]+')
            echo "mihomo 版本: $VER"
            curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-linux-amd64-$VER.gz" -o mihomo.gz
            # 从 GitHub Releases 经 HTTPS 下载。注意：mihomo 官方 release 不发布
            # 独立校验和文件，完整性依赖 GitHub 分发链路（TLS）；如需更强校验可改为
            # 自托管二进制，或钉选固定版本并手算 SHA256 后在此显式比对。
            gunzip -f mihomo.gz && chmod +x mihomo
          fi
          ./mihomo -v || true

      - name: Run All Platforms Checkin
        id: checkin
        run: bash run_checkin.sh
        timeout-minutes: 8

      - name: Check Skip Afternoon
        id: skip_check
        run: |
          if grep -q "SKIP_AFTERNOON=true" checkin_output.txt; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "🎉 上午全部成功，下午已跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Retry on Failure
        if: failure()
        run: |
          echo "首次失败，60秒后重试..."
          sleep 60
          bash run_checkin.sh
        timeout-minutes: 5

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkin-debug-${{ github.run_id }}
          path: |
            checkin_output.txt
            mihomo.log
          if-no-files-found: ignore
          retention-days: 7
