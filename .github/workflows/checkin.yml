name: 多平台自动签到（GLaDOS + ikuuu + SMAI）

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30) - 上午签到
    - cron: '30 1 * * *'
    # 北京时间 19:30 (UTC 11:30) - 下午签到
    - cron: '30 11 * * *'
  workflow_dispatch:

# 最小权限：本工作流只用 GITHUB_TOKEN 做 checkout + 上传日志 artifact；
# SMAI token 回写走用户自备的 REPO_PAT（建议细粒度令牌，仅本仓 Secrets: write）。
permissions:
  contents: read
  actions: write

# 防止重叠运行（定时/手动同时触发时排队，不互相打断导致重复签到）
concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # ★ 必须**大于**各步骤超时之和（4+3=7）再留余量：
    #   只要 job 先于步骤超时，就不会出现「job 被 cancelled」——
    #   而 cancelled 的 job GitHub 不保留日志，等于黑盒（2026-10-05 就吃了这个亏）。
    #   让步骤超时先触发，失败会带日志，可查。
    timeout-minutes: 10
    # 所有步骤共用同一套 Secret 环境，避免「Run / Retry」两步各写一遍导致漏配
    env:
      GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      WPUSH_APIKEY: ${{ secrets.WPUSH_APIKEY }}
      IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
      SMAI_SESSION: ${{ secrets.SMAI_SESSION }}
      SMAI_USER_ID: ${{ secrets.SMAI_USER_ID }}
      SMAI_REFRESH: ${{ secrets.SMAI_REFRESH }}
      REPO_PAT: ${{ secrets.REPO_PAT }}

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复签到状态缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .checkin_state.json
          key: checkin-state-${{ github.run_id }}
          restore-keys: |
            checkin-state-

      - name: 恢复 ikuuu Cookie 缓存
        # ikuuu-cookie.yml 每 3 天用无头浏览器刷新一次 Cookie 并写回这里。
        # checkin.py 优先使用该文件（而非可能已过期的 IKUUU_COOKIE Secret）。
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ikuuu_cookie.json
          key: ikuuu-cookie-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ikuuu-cookie-v1-

      - name: 安装 Xvfb（GLaDOS 需要「有头」浏览器过 Turnstile）
        # 无头模式下 Turnstile 不渲染交互框，必须给它一个虚拟显示。
        # 安装失败不阻断：glados_browser 会退回无头模式（签到可能失败，其余平台照常）。
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run 已存在，跳过安装"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          fi

      - name: 执行多平台签到
        id: checkin
        # 正常耗时 < 1 分钟。窗口不宜过大：一旦某个请求卡住，
        # 会白等到 job 级超时被 cancelled，而 cancelled 的 job 不留日志。
        # 4 分钟 —— 宁可让这一步「失败」（有日志可查），也不要整体被取消。
        # xvfb-run 提供 DISPLAY，glados_browser 会自动切到有头模式。
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python checkin.py 2>&1 | tee checkin_output.txt
          else
            echo "⚠️ 无 xvfb-run，退回无头模式（GLaDOS 可能失败）"
            python checkin.py 2>&1 | tee checkin_output.txt
          fi
        timeout-minutes: 4

      - name: 检查下午免签
        id: skip_check
        run: |
          if grep -q "SKIP_AFTERNOON=true" checkin_output.txt; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "🎉 上午全部成功，下午已跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 失败自动重试
        if: failure()
        # 含 60 秒 sleep，3 分钟足够（正常重试 < 1 分钟）
        timeout-minutes: 3
        run: |
          echo "首次失败，60秒后重试..."
          sleep 60
          python checkin.py 2>&1 | tee checkin_output.txt

      - name: 上传调试日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkin-debug-${{ github.run_id }}
          path: |
            checkin_output.txt
          if-no-files-found: ignore
          retention-days: 7
